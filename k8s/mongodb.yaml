apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-container
spec:
  selector:
    matchLabels:
      app: mongodb-container
  template:
    metadata:
      labels:
        app: mongodb-container
    spec:
      containers:
      - name: mongodb-container
        image: mongo:latest
        ports:
        - containerPort: 27017
        env:
         - name: MONGO_INITDB_ROOT_USERNAME
           valueFrom:
             secretKeyRef:
               name: mongodb-secret
               key: username
         - name: MONGO_INITDB_ROOT_PASSWORD
           valueFrom:
             secretKeyRef:
               name: mongodb-secret
               key: password
         - name: MONGO_INITDB_DATABASE
           valueFrom:
             secretKeyRef:
               name: mongodb-secret
               key: database
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
spec:
  selector:
    app: mongodb-container
  ports:
  - port: 27017
    targetPort: 27017

---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
type: Opaque
data:
  password: cGFzc3dvcmQ=
  username: dXNlcg==
  database: ZWNvbV9wcm9kdWN0cw==



