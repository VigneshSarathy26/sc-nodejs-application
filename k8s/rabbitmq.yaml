apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  selector:
    matchLabels:
      app: rabbitmq-container
  template:
    metadata:
      labels:
        app: rabbitmq-container
    spec:
      containers:
      - name: rabbitmq-container
        image: rabbitmq:3-management-alpine
        ports:
        - containerPort: 5672

---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
spec:
  selector:
    app: rabbitmq-container
  ports:
  - port: 5672
    targetPort: 5672
