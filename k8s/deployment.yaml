# 1. Redis Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  selector:
    matchLabels:
      app: redis-cache
  template:
    metadata:
      labels:
        app: redis-cache
    spec:
      containers:
      - name: redis
        image: redis:6.2-alpine
        ports:
        - containerPort: 6379
          name: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  selector:
    app: redis-cache
  ports:
  - name: redis
    protocol: TCP
    port: 6379
    targetPort: redis

---
# 2. RabbitMQ Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  selector:
    matchLabels:
      app: rabbitmq-container
  template:
    metadata:
      labels:
        app: rabbitmq-container
    spec:
      containers:
      - name: rabbitmq-container
        image: rabbitmq:3-management-alpine
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: management        
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
spec:
  selector:
    app: rabbitmq-container
  ports:
  - port: 5672           
    targetPort: amqp    
    protocol: TCP
    name: amqp
  - port: 15672  
    targetPort: management   
    protocol: TCP
    name: management    

---
# 3. Frontend Dashboard Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  selector:
    matchLabels:
      app: frontend-container
  template:
    metadata:
      labels:
        app: frontend-container
    spec:
      containers:
      - name: frontend-container
        image: mailtovignesh/nodejs-application-frontend-ui:latest
        ports:
        - containerPort: 8080
          name: http
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: frontend-container
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: http

---
# 4. User Service (Updated with Probes & Service Name)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
spec:
  replicas: 2
  selector:
    matchLabels:
      app: userservice-container
  template:
    metadata:
      labels:
        app: userservice-container
    spec:
      containers:
      - name: userservice-container
        image: mailtovignesh/nodejs-application-user-service:latest
        ports:
        - containerPort: 3001
          name: http
        env:
          - name: SERVICE_NAME
            value: "user-service"
          - name: AUTH_SECRET
            value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: users-service
spec:
  selector:
    app: userservice-container
  ports:
  - name: http
    protocol: TCP
    port: 3001
    targetPort: http

---
# 5. Product Service (Updated with Probes & Service Name)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-container
  template:
    metadata:
      labels:
        app: product-container
    spec:
      containers:
      - name: product-container
        image: mailtovignesh/nodejs-application-product-service:latest
        ports:
        - containerPort: 3002
          name: http
        env:
          - name: SERVICE_NAME
            value: "product-service"
          - name: REDIS_URL
            value: "redis://redis-service:6379"
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  selector:
    app: product-container
  ports:
  - name: http
    protocol: TCP
    port: 3002
    targetPort: http

---
# 6. Order Service (Updated with Probes & Service Name)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-container
  template:
    metadata:
