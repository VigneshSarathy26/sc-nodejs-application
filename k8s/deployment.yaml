# 8. MongoDB & Secret (Kept as is)
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
type: Opaque
data:
  password: cGFzc3dvcmQ=
  username: dXNlcg==
  database: ZWNvbV9wcm9kdWN0cw==
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-container
spec:
  selector:
    matchLabels:
      app: mongodb-container
  template:
    metadata:
      labels:
        app: mongodb-container
    spec:
      containers:
      - name: mongodb-container
        image: mongo:latest
        ports:
        - containerPort: 27017
          name: mongo
        env:
         - name: MONGO_INITDB_ROOT_USERNAME
           valueFrom:
             secretKeyRef:
               name: mongodb-secret
               key: username
         - name: MONGO_INITDB_ROOT_PASSWORD
           valueFrom:
             secretKeyRef:
               name: mongodb-secret
               key: password
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: mongodb-container
  ports:
  - name: mongo
    protocol: TCP
    port: 27017
    targetPort: mongo