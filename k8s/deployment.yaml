            port: 3003
          initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
spec:
  selector:
    app: orders-container
  ports:
  - name: http
    protocol: TCP
    port: 3003
    targetPort: http

---
# 7. Gateway Service (Updated with Probes)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  selector:
    matchLabels:
      app: gateway-container
  template:
    metadata:
      labels:
        app: gateway-container
    spec:
      containers:
      - name: gateway-container
        image: mailtovignesh/nodejs-application-gateway-service:latest
        ports:
        - containerPort: 3000
          name: http
        env:
          - name: SERVICE_NAME
            value: "api-gateway"
          - name: PRODUCT_SERVICE_URL
            value: "http://product-service:3002"
          - name: ORDER_SERVICE_URL
            value: "http://orders-service:3003"
          - name: USER_SERVICE_URL
            value: "http://users-service:3001"
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway-container
  type: ClusterIP
  ports:
  - name: http
    protocol: TCP
    port: 3000
    targetPort: http

